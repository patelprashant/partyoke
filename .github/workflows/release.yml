name: Release

# Triggered by pushing a SemVer tag like v1.2.0. Builds a SIGNED release APK and
# AAB, then publishes a GitHub Release with auto-generated notes and the
# artifacts attached. Version is derived entirely from the tag — no manual edits
# to build.gradle.kts are needed.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write # needed to create the GitHub Release

jobs:
  release:
    name: Build signed release & publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so release notes can diff from last tag

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Derive versionName from the tag (strip leading "v") and use the run
      # number as a monotonically increasing versionCode.
      - name: Derive version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION_NAME="${TAG#v}"
          VERSION_CODE="${GITHUB_RUN_NUMBER}"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION_NAME (code $VERSION_CODE) from tag $TAG"

      # Decode the keystore from the base64 secret into a file on the runner.
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set. Add signing secrets in repo Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed APK and AAB
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease :app:bundleRelease \
            -PappVersionName="${{ steps.version.outputs.name }}" \
            -PappVersionCode="${{ steps.version.outputs.code }}" \
            -PANDROID_KEYSTORE_FILE="$ANDROID_KEYSTORE_FILE" \
            -PANDROID_KEYSTORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" \
            -PANDROID_KEY_ALIAS="$ANDROID_KEY_ALIAS" \
            -PANDROID_KEY_PASSWORD="$ANDROID_KEY_PASSWORD" \
            --stacktrace

      # Rename artifacts to include the version for clarity on the Releases page.
      - name: Stage release artifacts
        id: artifacts
        run: |
          mkdir -p release-artifacts
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          AAB=$(find app/build/outputs/bundle/release -name "*.aab" | head -n1)
          V="${{ steps.version.outputs.name }}"
          cp "$APK" "release-artifacts/partyoke-${V}.apk"
          cp "$AAB" "release-artifacts/partyoke-${V}.aab"
          ls -la release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PartyOke ${{ steps.version.outputs.name }}
          generate_release_notes: true # auto notes from merged PRs/commits
          fail_on_unmatched_files: true
          files: |
            release-artifacts/partyoke-${{ steps.version.outputs.name }}.apk
            release-artifacts/partyoke-${{ steps.version.outputs.name }}.aab
